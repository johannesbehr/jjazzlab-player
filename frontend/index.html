<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>JJazzLab Player</title>

    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/MobileMenu.css"/>
    <link rel="stylesheet" href="css/MessageBox.css"/>
</head>

<body>

<div id="messageBoxContainer"></div>
<div id="mobileMenu"></div>

<div class="container">
    <h1 style="color: black;">JJazzLab Player 2</h1>

	<div id="mainViewConatiner" >

		<div id="soundFontStatus" class="soundfont-status">

			<div id="soundFontStatusText">
				Loading SoundFont ...
			</div>

			<div class="soundfont-progress-container">
				<div
					id="soundFontProgress"
					class="soundfont-progress"
					style="width: 0%">
				</div>
			</div>

		</div>

		<div id="songInfo">

			Song: <input id="songName" value="–" style="width: 120px;"></input>

			<label for="tempoInput" style="margin-left: 20x;">
				BPM:
			</label>

			<input
				type="number"
				id="tempoInput"
				min="20"
				max="300"
				step="1"
				value="120"
				style="width: 50px;"/>
		
		
	<label for="sizeInput" style="margin-left: 10px;">
				Bars:
			</label>

			<input
				type="number"
				id="sizeInput"
				min="1"
				step="1"
				value=""
				style="width: 50px;"/>
		</div>

			<div class="toolbar">

				<input
					type="file"
					id="fileInput"
					accept=".sng,.xml"
					class="hidden"/>


				<button id="playButton" disabled>
					▶ Play
				</button>

				<button id="stopButton" disabled>
					■ Stop
				</button>

			</div>

			<div id="status" hidden>
				Initialising...
			</div>

			<div id="songEditorContainer"></div>

			<button id="rawXmlButton" class="hidden">
				Raw XML
			</button>

			<div id="rawXmlContainer" class="hidden">

				<textarea
					id="rawXml"
					spellcheck="false"
					placeholder="Hier wird das XML des aktuellen Songs angezeigt..."></textarea>

			</div>
		</div>
		<div id="aboutContainer" style="display: none;">
			<div id="aboutContainerHtml"></div>
			<div class="about-options">
				<label>
					<input type="checkbox" id="skipAbout"/>
					Do not show this information again on the next startup
				</label>
			</div>
			<button id="closeAbout">
				Got it.
			</button>
		</div>

		<script type="module" src="./main.bundle.js"></script>

	</body>
</html>
